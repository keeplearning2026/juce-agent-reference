[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "juce-reference"
version = "0.1.0"
description = "JUCE Agent Reference Generator — Doxygen XML to Markdown API reference with search indexes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "lxml>=5,<7",
    "typer>=0.16,<1",
    "rich>=14,<15",
    "platformdirs>=4,<5",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "mypy>=1.17,<3",
]

[project.scripts]
juce-doc = "juce_reference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["juce_reference"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-v", "--tb=short", "--strict-markers"]
